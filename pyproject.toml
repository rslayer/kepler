[project]
name = "forecast-research-loop"
version = "0.1.0"
description = "Forecasting research loop prototype (M5 / Walmart CA_1 FOODS_3)"
requires-python = ">=3.11,<3.13"

# Pinned exactly. Determinism is a Phase 1 acceptance criterion; floating
# dependency versions are the most common way to lose it.
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "pyarrow==18.1.0",
    "lightgbm==4.5.0",
    "scikit-learn==1.5.2",
    "statsmodels==0.14.4",
]

[project.optional-dependencies]
# Only needed for `make data`. Reads ~/.kaggle/kaggle.json itself; no agent touches it.
data = ["kaggle==1.6.17"]

[tool.uv]
package = false
